# Content for Part 1 of the Workshop 2 deck (the bonus section is slides_bonus.yaml, appended after the last
# slide here). Layout code lives in build_deck.py; edit words here.
# Markup: **bold** inside a line. "define" entries become definition cards.
# id: a stable name for every slide. Slide numbers are computed from position; "{slide:<id>}" anywhere renders as
#   that slide's live number, so inserting a slide never breaks a cross-reference. The self-check maps are keyed
#   by id (build_deck.py: EXPECTED_RUNS, EXPECTED_STAGES, MAIN_COUNT, MAIN_MINUTES).
# visual kinds: image (D_ figure we draw), result (F1..F6, placeholder until its PNG exists), stack, pair,
#   pipeline, cards, tiles (dict cards with head/body/foot/mark), table (the data card), grid (a general table),
#   sets, stat, chart_prices, chart_scatter, chart_trials, portfolio, qr
# layouts: title, side (text left, visual right), wide (visual on top), full (visual across, lines beneath)
# finance: the row of the "Textbook ML vs finance ML" table this slide illustrates, drawn as a small
#   "In finance" chip; the self-check requires it to name an existing row.
# minutes: [start, end] within Part 1 (contiguous from 0 to MAIN_MINUTES). run: notebook section number.
# stage: where the slide sits on the process map, drawn as a strip of the six steps above the title.
#   none = no strip; ahead = strip with nothing lit; otherwise a step name from `process`, lit in brand blue.
#   stage_tail adds one small lit chip after the last step.
# reading / reading_full: the "Reference:" footer line and the full citation in the notes (key names kept).

# The six steps of slide 2's map and of the strip on every content slide: [name, caption].
process:
  - ["Prices", "daily prices of 40 stocks"]
  - ["Features", "clues computed only from the past"]
  - ["Model", "a rule learned from past examples, giving a forecast per stock"]
  - ["Check", "is the result real or luck?"]
  - ["Portfolio", "which stocks to buy and which to sell"]
  - ["Backtest", "a replay on years the model never saw"]

sections:
  0: "Setup"
  1: "The data"
  2: "Features, the target and the no-peeking rule"
  3: "A baseline and a fair test"
  4: "A real ML model"
  5: "Overfitting, live"
  6: "From forecasts to a portfolio"
  7: "Your strategy's backtest"
  8: "Export and paper trading"

slides:
  - id: title
    stage: none
    layout: title
    title: "Machine Learning for Quantitative Finance"
    subtitle: "Part 1 · A QuantSoc workshop · about 70 minutes"
    lines:
      - "Open the workshop notebook in Colab now and run section 0, Setup. Link: quant-soc.com/links/workshop-2"
    minutes: [0, 1]
    notes: >-
      Welcome everyone, this is Part 1 of Machine Learning for Quantitative Finance from the Quantitative Finance Society.
      Please open the workshop notebook in Colab and run section 0, Setup, while I talk: the download takes a few seconds, the imports a few more.
      You need no machine learning and no finance background, only a little Python.
      Every term I use will be defined the first time it appears.
    cue: "Ask the room to run notebook section 0, Setup, now. Wait for most hands to show it finished before slide {slide:data}."

  - id: map
    stage: none
    title: "What we're building"
    layout: wide
    visual:
      kind: pipeline      # steps: the top-level `process` list
    lines:
      - "Five short tasks. Each one sets one **knob** of your own strategy."
      - "At the end, the backtest runs **your** choices, and you take the code home."
    chips: ["momentum lookback", "extra feature", "train and test dates", "forest size and depth", "long/short counts and rebalance"]
    minutes: [1, 3]
    notes: >-
      This is the whole journey on one slide: prices, then features, then a model that gives a forecast for each stock, then a check that the result is real and not luck, then a portfolio, then a backtest.
      From the next slide on, the strip across the top of every slide shows where we are on this map, with the current step lit in blue.
      A feature is just a clue we compute from past prices, and a model is a rule the computer learns from past examples.
      You will do five tasks, and each one is copy and change: a worked example sits right above, and you change one to three numbers on its first line.
      Each task sets one knob of your strategy, so the final result is genuinely yours.

  - id: textbook_vs_finance
    stage: ahead
    title: "Textbook ML vs finance ML"
    layout: full
    visual:
      kind: grid
      header: ["", "Textbook ML", "Finance ML"]
      widths: [0.14, 0.34, 0.52]
      highlight: 2
      size: 15
      header_size: 16
      pad_y: 0.07
      rows:
        - ["Data", "Independent draws from one fixed process", "Time-ordered, regimes change, and failed firms drop out (survivorship)"]
        - ["Signal", "Strong: a cat photo shows a cat", "Tiny next to the noise"]
        - ["Validation", "Shuffled k-fold cross-validation", "Walk-forward or purged, with a gap"]
        - ["Labels", "Independent of each other", "Overlapping in time"]
        - ["Sample size", "Often huge", "Fewer independent observations than it looks"]
        - ["Models", "Whatever wins benchmarks: often deep nets", "Regularised linear models, tree ensembles, small neural nets; deep learning mainly on raw order-book data"]
        - ["Features", "Often raw inputs (pixels, words), learned end to end", "Engineered from prices, accounts and alternative data"]
        - ["Success", "Accuracy or loss on held-out data", "Out-of-sample IC, then Sharpe after costs"]
    reading: 'López de Prado (2018), The 10 Reasons Most Machine Learning Funds Fail, J. Portfolio Management 44(6), 120-133; Gu, Kelly, Xiu (2020), Empirical Asset Pricing via Machine Learning, RFS 33(5), 2223-2273'
    reading_full:
      - 'López de Prado, M. (2018). "The 10 Reasons Most Machine Learning Funds Fail." The Journal of Portfolio Management, 44(6), 120-133. https://doi.org/10.3905/jpm.2018.44.6.120 (free copy: SSRN 3104816)'
      - 'Gu, S., Kelly, B. and Xiu, D. (2020). "Empirical Asset Pricing via Machine Learning." The Review of Financial Studies, 33(5), 2223-2273. (Models row: tables of stock characteristics.)'
      - 'Sirignano, J. and Cont, R. (2019). "Universal features of price formation in financial markets: perspectives from deep learning." Quantitative Finance, 19(9), 1449-1459. (Models row: deep learning on order books.)'
      - 'Ke, Z. T., Kelly, B. T. and Xiu, D. (2019). "Predicting Returns with Text Data." NBER Working Paper 26186. (Models row: text, with a screening and topic model.)'
    minutes: [3, 6]
    notes: >-
      Machine learning, ML for short, means a computer learning a rule from examples instead of being told the rule.
      Most courses teach it on textbook problems such as recognising cats in photos, and finance breaks almost every assumption those problems make, row by row.
      Data: in a textbook each example is a fresh, independent draw from one process that never changes; market data arrives in time order, and the process itself changes, which is called a change of regime, for example calm years followed by a crisis. And companies that fail tend to drop out of the data, so what is left looks better than the past really was; that is survivorship bias, slide {slide:survivorship}.
      Signal: a photo of a cat really does show a cat, but a stock's past gives only a tiny hint about its future, buried in random day to day noise.
      Validation means testing a model fairly on data it did not learn from. Textbooks shuffle the rows and cut them into k groups, testing on each group in turn, which is called k-fold cross-validation; in finance we test only on later years, called walk-forward, or we remove the training rows that overlap the test, called purging, and leave a gap.
      Labels are the answers we train on. Ours are five-day returns, so the labels of neighbouring days share four of their five days, and that overlap is why the sample size row says there are fewer independent observations than the row count suggests.
      Models: regularised means a model is held back from fitting too closely, and a tree ensemble is many decision trees averaged, which we build later. On tables of stock characteristics, Gu, Kelly and Xiu found that trees and neural networks beat linear models, and that among neural networks a few hidden layers, best at three, beat deeper ones. Deep learning is used mainly on raw order-book data, the live list of orders waiting to buy and sell, as in Sirignano and Cont. Text models are often simple, as in Ke, Kelly and Xiu, who use a screening and topic model rather than a deep network.
      Features are the inputs: textbook models often read raw inputs such as pixels or words and learn their own features end to end, while finance features are engineered by hand from prices, company accounts and other data.
      Success: a textbook scores accuracy, or a loss, on held-out data. In finance the first question is whether the forecasts rank the stocks correctly on data the model never saw, measured by the information coefficient, IC, the correlation between forecasts and outcomes across stocks on one day; then a trader scores money made per unit of risk after paying for every trade, the Sharpe ratio after costs, which slide {slide:trying_many} defines.
      López de Prado lists ten common mistakes in financial machine learning; today we meet two of them, leakage and backtest overfitting, and the noise in the signal row is why they bite.
      From now on, a small blue tag at the top right of a slide, In finance, names the row of this table that the slide is about.

  - id: data
    stage: Prices
    title: "The data"
    layout: side
    run: 1
    lines:
      - "40 large US companies, one price per trading day, 2000 to 2019."
    define:
      - ["Return", "how much the price moved: today's price divided by yesterday's, minus 1. Up 2% is a return of 0.02."]
      - ["Adjusted close", "the closing price corrected for share splits and dividends, so returns are fair."]
    visual:
      kind: chart_prices
      symbols: ["KO", "JPM", "XOM", "GE"]
      caption: "Adjusted close, rescaled so each stock starts at 100 (real data, Yahoo snapshot)"
    reading: 'López de Prado (2018), Advances in Financial Machine Learning, Wiley, ch. 2, Financial Data Structures'
    reading_full:
      - 'López de Prado, M. (2018). Advances in Financial Machine Learning. Wiley. Chapter 2 "Financial Data Structures"; Chapter 7 "Cross-Validation in Finance"; Chapter 11 "The Dangers of Backtesting". This slide: chapter 2.'
    minutes: [6, 9]
    notes: >-
      Run notebook section 1 now: it loads the prices and draws a chart like this one.
      Each line is one company's price over twenty years, rescaled so they all start at 100, so you can compare them.
      We never model prices directly; we model returns, which is how much the price moved, as a fraction.
      We use the adjusted close, which is corrected for splits and dividends, so a stock splitting in two does not look like a crash.
    cue: "▶ Notebook: run section 1, The data."

